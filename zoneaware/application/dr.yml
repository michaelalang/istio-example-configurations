apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: http
  namespace: frontends
spec:
  host: http.frontends.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      consistentHash:
        useSourceIp: false
      localityLbSetting:
        enabled: true
        failover:
          - from: east
            to: west
          - from: west
            to: east
    outlierDetection:
      baseEjectionTime: 30s
      consecutive5xxErrors: 3
      interval: 10s
      maxEjectionPercent: 100
