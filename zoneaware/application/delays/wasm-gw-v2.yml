apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: gw-delay-v2
  namespace: frontends
spec:
  imagePullPolicy: IfNotPresent
  pluginConfig:
    allow_missing_identity: true
    allowed_namespaces: ["gateways"]
    allowed_service_accounts: ["gw1","gw2"]
    delays:
      gw1: 1000
      gw2: 0
  url: oci://quay.io/rhn_support_milang/wasmdelay:v1
  type: HTTP
  selector:
    matchLabels:
      app: http
      version: v2
