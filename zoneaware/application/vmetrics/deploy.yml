apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmetrics
  namespace: vmetrics
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: vmetrics
      version: v1
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        sidecar.istio.io/nativeSidecar: 'true'
      creationTimestamp: null
      labels:
        app: vmetrics
        sidecar.istio.io/inject: 'true'
        version: v1
    spec:
      containers:
        - image: docker.io/victoriametrics/victoria-metrics
          imagePullPolicy: IfNotPresent
          args:
          - -storageDataPath=data
          name: metrics
          ports:
            - containerPort: 8428
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - name: data-metrics
            mountPath: /data
        - image: docker.io/victoriametrics/victoria-logs
          imagePullPolicy: IfNotPresent
          args:
          - -storageDataPath=data
          name: logs
          ports:
            - containerPort: 9428
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - name: data-logs
            mountPath: /data
        - image: docker.io/victoriametrics/victoria-traces
          imagePullPolicy: IfNotPresent
          args:
          - -storageDataPath=data
          name: traces
          ports:
            - containerPort: 10428
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - name: data-traces
            mountPath: /data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      serviceAccount: default
      volumes:
      - name: data-metrics
        persistentVolumeClaim:
          claimName: data-metrics
      - name: data-logs
        persistentVolumeClaim:
          claimName: data-logs
      - name: data-traces
        persistentVolumeClaim:
          claimName: data-traces
